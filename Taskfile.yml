# @gitian Task runner (go-task) — orchestrates all system operations from a single CLI.
# Run `task --list` to see available commands. Covers: build, switch, deploy,
# home-manager, secrets management, flake ops, maintenance, and microVM control.
version: "3"

vars:
  FLAKE_DIR: "{{.USER_WORKING_DIR}}"
  NIXOS_HOST: "baradur"
  DARWIN_HOST: "mingabook"
  NIXOS_USER: "arrayofone"
  DARWIN_USER: "darrenbangsund"
  MICROVM_HOST: "helms-deep"

tasks:
  # =============================================================================
  # SYSTEM OPERATIONS
  # =============================================================================

  build:nixos:
    desc: "Build NixOS system configuration"
    cmds:
      - sudo nixos-rebuild build --flake {{.FLAKE_DIR}}#{{.NIXOS_HOST}}

  build:darwin:
    desc: "Build Darwin system configuration"
    cmds:
      - darwin-rebuild build --flake {{.FLAKE_DIR}}#{{.DARWIN_HOST}}

  switch:nixos:
    desc: "Switch to new NixOS configuration"
    cmds:
      - sudo nixos-rebuild switch --flake {{.FLAKE_DIR}}#{{.NIXOS_HOST}}

  switch:darwin:
    desc: "Switch to new Darwin configuration"
    cmds:
      - darwin-rebuild switch --flake {{.FLAKE_DIR}}#{{.DARWIN_HOST}}

  test:nixos:
    desc: "Test NixOS configuration (activate without adding to bootloader)"
    cmds:
      - sudo nixos-rebuild test --flake {{.FLAKE_DIR}}#{{.NIXOS_HOST}}

  boot:nixos:
    desc: "Add NixOS configuration to bootloader without activating"
    cmds:
      - sudo nixos-rebuild boot --flake {{.FLAKE_DIR}}#{{.NIXOS_HOST}}

  dry-run:nixos:
    desc: "Show what would change in NixOS without applying"
    cmds:
      - sudo nixos-rebuild dry-run --flake {{.FLAKE_DIR}}#{{.NIXOS_HOST}}

  # vm:nixos:
  #   desc: "Build and run NixOS configuration in VM"
  #   cmds:
  #     - sudo nixos-rebuild build-vm --flake {{.FLAKE_DIR}}#{{.NIXOS_HOST}}
  #     - echo "VM built! Run: ./result/bin/run-{{.NIXOS_HOST}}-vm"

  # =============================================================================
  # HOME MANAGER OPERATIONS
  # =============================================================================

  home:nixos:
    desc: "Switch Home Manager configuration (NixOS)"
    cmds:
      - home-manager switch --flake {{.FLAKE_DIR}}#{{.NIXOS_USER}}@{{.NIXOS_HOST}}

  home:darwin:
    desc: "Switch Home Manager configuration (Darwin)"
    cmds:
      - home-manager switch --flake {{.FLAKE_DIR}}#{{.DARWIN_USER}}@{{.DARWIN_HOST}}

  home:build:nixos:
    desc: "Build Home Manager configuration (NixOS)"
    cmds:
      - home-manager build --flake {{.FLAKE_DIR}}#{{.NIXOS_USER}}@{{.NIXOS_HOST}}

  home:build:darwin:
    desc: "Build Home Manager configuration (Darwin)"
    cmds:
      - home-manager build --flake {{.FLAKE_DIR}}#{{.DARWIN_USER}}@{{.DARWIN_HOST}}

  # =============================================================================
  # FLAKE MANAGEMENT
  # =============================================================================

  update:
    desc: "Update all flake inputs"
    cmds:
      - nix flake update {{.FLAKE_DIR}}
      - echo "✅ Flake inputs updated!"

  update:input:
    desc: "Update specific flake input"
    cmds:
      - nix flake lock --update-input {{.CLI_ARGS}} {{.FLAKE_DIR}}
    requires:
      vars: [CLI_ARGS]

  check:
    desc: "Check flake for errors"
    cmds:
      - nix flake check {{.FLAKE_DIR}}

  show:
    desc: "Show flake outputs"
    cmds:
      - nix flake show {{.FLAKE_DIR}}

  metadata:
    desc: "Show flake metadata"
    cmds:
      - nix flake metadata {{.FLAKE_DIR}}

  # =============================================================================
  # DEVELOPMENT WORKFLOW
  # =============================================================================

  dev:
    desc: "Enter development shell"
    cmds:
      - nix develop {{.FLAKE_DIR}}#digits
    interactive: true

  dev:command:
    desc: "Run command in development shell"
    cmds:
      - nix develop {{.FLAKE_DIR}}#digits --command {{.CLI_ARGS}}
    requires:
      vars: [CLI_ARGS]

  shell:
    desc: "Enter specific shell environment"
    cmds:
      - nix develop {{.FLAKE_DIR}}#{{.CLI_ARGS | default "digits"}}
    interactive: true

  # =============================================================================
  # PACKAGES & BUILDING
  # =============================================================================

  build:package:
    desc: "Build custom package"
    cmds:
      - nix build {{.FLAKE_DIR}}#{{.CLI_ARGS}}
    requires:
      vars: [CLI_ARGS]

  run:package:
    desc: "Run custom package"
    cmds:
      - nix run {{.FLAKE_DIR}}#{{.CLI_ARGS}}
    requires:
      vars: [CLI_ARGS]

  # =============================================================================
  # SECRETS MANAGEMENT
  # =============================================================================

  # @gitian:secret Secrets management tasks — init, edit, encrypt, decrypt.
  # Uses SOPS + age encryption. See [[secrets]] for the full key hierarchy.
  secrets:init:
    desc: "Initialize secrets keys and files for the current host and user"
    cmds:
      - scripts/init-secrets.sh

  secrets:edit:system:
    desc: "Edit system secrets (secrets/$(hostname).yaml)"
    cmds:
      - scripts/manage-secrets.sh edit system

  secrets:edit:user:
    desc: "Edit user secrets (secrets/$(whoami).yaml)"
    cmds:
      - scripts/manage-secrets.sh edit user

  secrets:encrypt:system:
    desc: "Re-encrypt system secrets"
    cmds:
      - scripts/manage-secrets.sh encrypt system

  secrets:encrypt:user:
    desc: "Re-encrypt user secrets"
    cmds:
      - scripts/manage-secrets.sh encrypt user

  secrets:decrypt:system:
    desc: "Decrypt and show system secrets"
    cmds:
      - scripts/manage-secrets.sh decrypt system

  secrets:decrypt:user:
    desc: "Decrypt and show user secrets"
    cmds:
      - scripts/manage-secrets.sh decrypt user

  # =============================================================================
  # MAINTENANCE & CLEANUP
  # =============================================================================

  gc:
    desc: "Run garbage collection"
    cmds:
      - sudo nix-collect-garbage -d
      - nix-store --optimise
      - echo "🗑️  Garbage collection completed!"

  gc:old:
    desc: "Clean generations older than specified days (default: 7)"
    cmds:
      - sudo nix-collect-garbage --delete-older-than {{.CLI_ARGS | default "7d"}}
      - echo "🗑️  Cleaned generations older than {{.CLI_ARGS | default "7d"}}"

  optimize:
    desc: "Optimize Nix store"
    cmds:
      - nix-store --optimise
      - echo "⚡ Store optimization completed!"

  generations:nixos:
    desc: "List NixOS system generations"
    cmds:
      - sudo nix-env --list-generations --profile /nix/var/nix/profiles/system

  generations:home:
    desc: "List Home Manager generations"
    cmds:
      - home-manager generations

  rollback:nixos:
    desc: "Rollback NixOS to previous generation"
    cmds:
      - sudo nixos-rebuild switch --rollback

  # =============================================================================
  # SYSTEM INFORMATION
  # =============================================================================

  info:system:
    desc: "Show system information"
    cmds:
      - echo "=== System Information ==="
      - uname -a
      - echo ""
      - echo "=== NixOS Version ==="
      - nixos-version 2>/dev/null || echo "Not on NixOS"
      - echo ""
      - echo "=== Nix Version ==="
      - nix --version
      - echo ""
      - echo "=== Home Manager Version ==="
      - home-manager --version 2>/dev/null || echo "Home Manager not available"

  info:flake:
    desc: "Show flake information"
    cmds:
      - echo "=== Flake Metadata ==="
      - nix flake metadata {{.FLAKE_DIR}}
      - echo ""
      - echo "=== Flake Show ==="
      - nix flake show {{.FLAKE_DIR}}

  # =============================================================================
  # SERVICES MANAGEMENT
  # =============================================================================

  service:ollama:
    desc: "Check Ollama service status"
    cmds:
      - systemctl status ollama

  service:restart:
    desc: "Restart system service"
    cmds:
      - sudo systemctl restart {{.CLI_ARGS}}
    requires:
      vars: [CLI_ARGS]

  service:status:
    desc: "Check service status"
    cmds:
      - systemctl status {{.CLI_ARGS}}
    requires:
      vars: [CLI_ARGS]

  # =============================================================================
  # QUICK WORKFLOWS
  # =============================================================================

  deploy:nixos:
    desc: "Full NixOS deployment workflow"
    cmds:
      - task: check
      - task: build:nixos
      - task: switch:nixos
      - task: home:nixos
      - echo "🚀 NixOS deployment completed!"

  deploy:darwin:
    desc: "Full Darwin deployment workflow"
    cmds:
      - task: check
      - task: build:darwin
      - task: switch:darwin
      - task: home:darwin
      - echo "🚀 Darwin deployment completed!"

  update:deploy:nixos:
    desc: "Update and deploy NixOS"
    cmds:
      - task: update
      - task: deploy:nixos
      - echo "✅ Update and deployment completed!"

  update:deploy:darwin:
    desc: "Update and deploy Darwin"
    cmds:
      - task: update
      - task: deploy:darwin
      - echo "✅ Update and deployment completed!"

  maintenance:
    desc: "Weekly maintenance routine"
    cmds:
      - echo "🔄 Starting maintenance routine..."
      - task: update
      - task: gc:old -- 14d
      - task: optimize
      - echo "✨ Maintenance completed!"

  # =============================================================================
  # DEVELOPMENT HELPERS
  # =============================================================================

  fmt:
    desc: "Format Nix files"
    cmds:
      - find {{.FLAKE_DIR}} -name "*.nix" -exec nixfmt {} \;
      - echo "📝 Nix files formatted!"

  lint:
    desc: "Lint Nix files"
    cmds:
      - nix develop {{.FLAKE_DIR}}#digits --command statix check {{.FLAKE_DIR}}

  # =============================================================================
  # TROUBLESHOOTING
  # =============================================================================

  debug:nixos:
    desc: "Debug NixOS build with verbose output"
    cmds:
      - sudo nixos-rebuild switch --flake {{.FLAKE_DIR}}#{{.NIXOS_HOST}} --show-trace --verbose

  debug:home:
    desc: "Debug Home Manager build"
    cmds:
      - home-manager switch --flake {{.FLAKE_DIR}}#{{.NIXOS_USER}}@{{.NIXOS_HOST}} --show-trace

  clean:result:
    desc: "Clean build results"
    cmds:
      - rm -f {{.FLAKE_DIR}}/result*
      - echo "🧹 Build results cleaned!"

  # =============================================================================
  # MICROVM HOST OPERATIONS
  # =============================================================================

  build:microvm-host:
    desc: "Build microvm host (helms-deep) configuration"
    cmds:
      - nixos-rebuild build --flake {{.FLAKE_DIR}}#{{.MICROVM_HOST}} --target-host root@{{.MICROVM_HOST}}

  switch:microvm-host:
    desc: "Switch microvm host (helms-deep) to new configuration"
    cmds:
      - nixos-rebuild switch --flake {{.FLAKE_DIR}}#{{.MICROVM_HOST}} --target-host root@{{.MICROVM_HOST}}

  deploy:microvm-host:
    desc: "Full microvm host deployment workflow"
    cmds:
      - task: check
      - task: build:microvm-host
      - task: switch:microvm-host

  vm:list:
    desc: "List all microVMs on helms-deep"
    cmds:
      - ssh root@{{.MICROVM_HOST}} "systemctl list-units 'microvm@*' --no-pager"

  vm:status:
    desc: "Show status of a microVM (usage: task vm:status -- <vm-name>)"
    cmds:
      - ssh root@{{.MICROVM_HOST}} "systemctl status microvm@{{.CLI_ARGS}} --no-pager"
    requires:
      vars: [CLI_ARGS]

  vm:start:
    desc: "Start a microVM (usage: task vm:start -- <vm-name>)"
    cmds:
      - ssh root@{{.MICROVM_HOST}} "systemctl start microvm@{{.CLI_ARGS}}"
    requires:
      vars: [CLI_ARGS]

  vm:stop:
    desc: "Stop a microVM (usage: task vm:stop -- <vm-name>)"
    cmds:
      - ssh root@{{.MICROVM_HOST}} "systemctl stop microvm@{{.CLI_ARGS}}"
    requires:
      vars: [CLI_ARGS]

  vm:restart:
    desc: "Restart a microVM (usage: task vm:restart -- <vm-name>)"
    cmds:
      - ssh root@{{.MICROVM_HOST}} "systemctl restart microvm@{{.CLI_ARGS}}"
    requires:
      vars: [CLI_ARGS]

  vm:logs:
    desc: "Show logs for a microVM (usage: task vm:logs -- <vm-name>)"
    cmds:
      - ssh root@{{.MICROVM_HOST}} "journalctl -u microvm@{{.CLI_ARGS}} --no-pager -n 100"
    requires:
      vars: [CLI_ARGS]

  debug:microvm-host:
    desc: "Debug microvm host build with verbose output"
    cmds:
      - nixos-rebuild switch --flake {{.FLAKE_DIR}}#{{.MICROVM_HOST}} --target-host root@{{.MICROVM_HOST}} --show-trace --verbose

  # =============================================================================
  # NETBOOT ARTIFACT PIPELINE (worker fleet)
  # =============================================================================

  netboot:host:
    desc: "Build a worker's netboot artifacts and atomically publish to TFTP"
    # MODE = nfs | ram. The host must set boot.loader.raspberry-pi.bootloader = "kernel".
    vars: { HOST: '{{.HOST}}', MAC: '{{.MAC}}', MODE: '{{.MODE}}' }
    cmds:
      - |
        set -euo pipefail
        test -e /proc/sys/fs/binfmt_misc/qemu-aarch64 || { echo "binfmt inactive — switch baradur first"; exit 1; }

        C=".#nixosConfigurations.{{.HOST}}.config"
        DST=/srv/netboot/{{.MAC}}            # matches tftp-unique-root=mac (lowercase, colon-sep)
        GEN="$DST/$(date +%s)"; mkdir -p "$GEN"

        # kernel (REAL attr); initrd differs by mode: ram = netbootRamdisk (store baked in).  [fix: re#F1/F2]
        KERNEL=$(nix build --no-link --print-out-paths "$C.system.build.kernel")
        if [ "{{.MODE}}" = "ram" ]; then
          INITRD=$(nix build --no-link --print-out-paths "$C.system.build.netbootRamdisk")
        else
          INITRD=$(nix build --no-link --print-out-paths "$C.system.build.initialRamdisk")
        fi
        install -Dm644 "$KERNEL/Image"  "$GEN/Image"
        install -Dm644 "$INITRD/initrd" "$GEN/initrd"

        # firmware blobs (start4.elf, fixup4.dat, *.dtb, overlays/) — NO `|| true`, fail loudly.  [fix: re#B1]
        # Vendor-vs-mainline is host-specific (see T1/T5 commit bodies) — try the vendor
        # firmwarePackage first; if it doesn't evaluate, fall back to nixpkgs#raspberrypifw and
        # hand-write config.txt (raspberrypifw ships no config.txt of its own).
        if FW=$(nix build --no-link --print-out-paths "$C.boot.loader.raspberry-pi.firmwarePackage" 2>/dev/null); then
          cp -r "$FW"/share/raspberrypi/boot/* "$GEN/"
          CFG=$(nix build --no-link --print-out-paths "$C.boot.loader.raspberry-pi.configTxtPackage")
          cp "$CFG/config.txt" "$GEN/config.txt"
        else
          echo "vendor firmwarePackage did not evaluate for {{.HOST}} — falling back to nixpkgs#raspberrypifw"
          FW=$(nix build --no-link --print-out-paths nixpkgs#raspberrypifw)
          cp -r "$FW"/share/raspberrypi/boot/* "$GEN/"
          cat > "$GEN/config.txt" <<'CFGEOF'
        kernel=Image
        initramfs initrd followkernel
        enable_uart=1
        arm_64bit=1
        CFGEOF
        fi

        # ensure config.txt names the kernel we installed ("Image") + the initrd:
        grep -q '^kernel=Image' "$GEN/config.txt" || echo "kernel=Image"            >> "$GEN/config.txt"
        grep -q '^initramfs initrd' "$GEN/config.txt" || echo "initramfs initrd followkernel" >> "$GEN/config.txt"

        # cmdline.txt — DRY: derive from the host's own kernelParams (set by root.nix nfs branch).  [fix: re#F4]
        nix eval --raw "$C.boot.kernelParams" --apply 'ps: builtins.concatStringsSep " " ps' \
          | sed 's/$/ console=tty1 console=serial0,115200/' > "$GEN/cmdline.txt"

        # HARD ASSERT a bootable set before publishing — never flip `current` to a broken tree.  [fix: re#B1]
        for f in start4.elf fixup4.dat config.txt cmdline.txt Image initrd; do
          test -s "$GEN/$f" || { echo "MISSING $f — refusing to publish"; exit 1; }
        done

        ln -sfn "$GEN" "$DST/current"        # atomic publish
        ls -dt "$DST"/[0-9]* | tail -n +4 | xargs -r rm -rf   # keep last 3 generations  [fix: re#B6]

  netboot:sdimage:
    desc: "Build a host's sdImage artifact and print the flashing hint"
    # ON-HARDWARE-VALIDATE: under the vendor modules confirm the sdImage attr and that its boot
    # partition layout matches Pi 4/5 firmware expectations.
    vars: { HOST: '{{.HOST}}' }
    cmds:
      - |
        set -euo pipefail
        test -e /proc/sys/fs/binfmt_misc/qemu-aarch64 || { echo "binfmt inactive — switch baradur first"; exit 1; }
        IMG=$(nix build --no-link --print-out-paths .#nixosConfigurations.{{.HOST}}.config.system.build.sdImage)
        echo "sdImage built: $IMG"
        echo "Flash: sudo dd if=$IMG/sd-image/*.img of=/dev/sdX bs=4M status=progress conv=fsync"
        echo "See docs/superpowers/plans/2026-06-21-pi-netboot-runbook.md for the full flashing/EEPROM procedure."

  netboot:seed:
    desc: "Pre-seed a host's SSH host key + age identity before first boot"
    vars: { HOST: '{{.HOST}}' }
    cmds:
      - mkdir -p /tmp/{{.HOST}}-seed && ssh-keygen -t ed25519 -N "" -f /tmp/{{.HOST}}-seed/ssh_host_ed25519_key && nix shell nixpkgs#ssh-to-age -c sh -c 'ssh-to-age < /tmp/{{.HOST}}-seed/ssh_host_ed25519_key.pub'
      - echo "Follow-ups — replace the .sops.yaml placeholder for {{.HOST}} with the age key printed above, then:"
      - echo "  sops updatekeys secrets/k3s-cluster.yaml"
      - echo "  create secrets/{{.HOST}}.yaml (per the runbook)"
      - echo "  copy /tmp/{{.HOST}}-seed/ssh_host_ed25519_key(.pub) into the state device's ssh/ dir"

  kubeconfig:fetch:
    desc: "Pull k3s kubeconfig from the worker and point it at the VLAN IP"
    vars: { IP: '{{.IP}}' } # worker VLAN IP
    cmds:
      - mkdir -p ~/.kube
      - ssh arrayofone@{{.IP}} sudo cat /etc/rancher/k3s/k3s.yaml | sed 's#https://127.0.0.1:6443#https://{{.IP}}:6443#' > ~/.kube/worker.yaml   # [fix: re#B2]
      - echo "export KUBECONFIG=~/.kube/worker.yaml"

  # =============================================================================
  # HELP & SHORTCUTS
  # =============================================================================

  help:
    desc: "Show available tasks"
    cmds:
      - task --list

  default:
    desc: "Show help by default"
    cmds:
      - task: help
